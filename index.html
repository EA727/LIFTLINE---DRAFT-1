<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LiftLine</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LiftLine">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;400&amp;family=Inter+Tight:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>

body{margin:0}
.ll *{box-sizing:border-box}
.halo{position:absolute;left:50%;bottom:-260px;width:520px;height:520px;margin-left:-260px;border-radius:50%;background:radial-gradient(circle,rgba(255,107,44,.16),rgba(255,107,44,0) 65%);pointer-events:none}
.halo2{position:absolute;right:-220px;top:-220px;width:440px;height:440px;border-radius:50%;background:radial-gradient(circle,rgba(91,140,255,.08),rgba(91,140,255,0) 65%);pointer-events:none}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 28px}
.top{height:72px;flex:none;display:flex;align-items:center;justify-content:space-between}
.body{flex:1;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column}
.body::-webkit-scrollbar{display:none}
.foot{flex:none;padding:12px 0 30px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;font-weight:400;letter-spacing:.2em;text-transform:uppercase}
.disp{font-family:'Unbounded',sans-serif;font-weight:200;letter-spacing:-.05em}
.t{margin:0;font-family:'Unbounded',sans-serif;font-weight:200;font-size:34px;line-height:1.08;letter-spacing:-.05em}
.p{margin:0;font-size:15px;line-height:1.6;color:#8B8F9A;font-weight:300}
.m{color:#8B8F9A}.d{color:#5C606B}.o{color:#FF6B2C}.bl{color:#7FA6FF}.w{color:#F5F5F7}
.li{width:100%;display:flex;align-items:center;gap:16px;padding:18px 0;border:0;border-bottom:1px solid rgba(255,255,255,.07);background:transparent;color:#F5F5F7;font-family:inherit;text-align:left;cursor:pointer}
.go{width:100%;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;border:0;background:transparent;color:#F5F5F7;font:400 17px 'Inter Tight',sans-serif;letter-spacing:-.01em;padding:0;cursor:pointer}
.orb{width:60px;height:60px;flex:none;border-radius:50%;background:radial-gradient(circle at 34% 28%,#FFC09A,#FF6B2C 48%,#C8410F);box-shadow:0 0 0 1px rgba(255,190,150,.35) inset,0 0 36px rgba(255,107,44,.55);display:flex;align-items:center;justify-content:center;color:#1A0A03;animation:glow 3.2s ease-in-out infinite}
.go[disabled]{color:#4A4E58;cursor:default}
.go[disabled] .orb{background:#16171C;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset;color:#4A4E58;animation:none}
.lk{min-height:44px;border:0;background:transparent;color:#8B8F9A;font:400 14px 'Inter Tight',sans-serif;padding:0;cursor:pointer;text-align:left}
.bk{min-height:44px;border:0;background:transparent;color:#8B8F9A;padding:0;display:flex;align-items:center;gap:10px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.inp{width:100%;height:54px;border:0;border-bottom:1px solid rgba(255,255,255,.16);border-radius:0;background:transparent;color:#F5F5F7;font:300 22px 'Inter Tight',sans-serif;letter-spacing:-.01em;padding:0;outline:none}
.inp:focus{border-bottom-color:#FF6B2C}
.chip{min-height:40px;padding:0 16px;border-radius:20px;background:transparent;font:400 14px 'Inter Tight',sans-serif;display:inline-flex;align-items:center;gap:9px;cursor:pointer}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.live{width:6px;height:6px;border-radius:50%;background:#7FA6FF;box-shadow:0 0 10px #5B8CFF;animation:pulse 1.8s ease-in-out infinite;flex:none}
.liveo{background:#FF6B2C;box-shadow:0 0 10px #FF6B2C}
.note{display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.5;font-weight:400}
.rise{animation:rise .7s cubic-bezier(.16,1,.3,1) both}
.rise2{animation:rise .7s .08s cubic-bezier(.16,1,.3,1) both}
.rise3{animation:rise .7s .16s cubic-bezier(.16,1,.3,1) both}
.spin{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes glow{0%,100%{box-shadow:0 0 0 1px rgba(255,190,150,.35) inset,0 0 30px rgba(255,107,44,.45)}50%{box-shadow:0 0 0 1px rgba(255,190,150,.35) inset,0 0 48px rgba(255,107,44,.75)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.view{flex:1;display:flex;flex-direction:column;animation-duration:.6s;animation-timing-function:cubic-bezier(.16,1,.3,1);animation-fill-mode:both}
@keyframes slideR{from{opacity:0;transform:translateX(56px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes slideL{from{opacity:0;transform:translateX(-56px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes zoomIn{from{opacity:0;transform:scale(.95);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}

html,body{height:100%;margin:0;background:#000;overscroll-behavior:none}
body{display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
#app{width:100%;max-width:440px;height:100vh;height:100dvh;position:relative}
.scr{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button,input{-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="ll" style="width:100%; height:100%; position:relative; overflow:hidden; background:#000; color:#F5F5F7; font-family:'Inter Tight', system-ui, sans-serif; filter:{{inv}}">
<div class="halo2" aria-hidden="true"></div><div class="halo" aria-hidden="true"></div>

<!-- WELCOME -->
<sc-if value="{{is.welcome}}" hint-placeholder-val="{{true}}">
<div class="scr">
<div class="top"><span class="mono w">{{appName}}</span><span class="mono m" style="display:flex; align-items:center; gap:10px"><span class="live"></span>UTSA</span></div>
<div class="body" style="justify-content:center">
<h1 class="t rise" style="font-size:54px; line-height:1">Train<br>around<br>your<br><span class="o" style="text-shadow:0 0 40px rgba(255,107,44,.5)">classes.</span></h1>
<p class="p rise2" style="margin-top:26px; max-width:280px">Workouts for your campus gym. Meals that fit your meal plan. Free for students.</p>
</div>
<div class="foot rise3">
<div class="mono d" style="padding-bottom:10px; border-bottom:1px solid rgba(255,255,255,.08)">Choose campus</div>
<button onClick="{{go.signup}}" class="go" style="margin-top:8px"><span style="display:flex; flex-direction:column; gap:4px; text-align:left"><span>UT San Antonio</span><span class="mono d" style="font-size:9px">Main campus</span></span><span class="orb"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></span></button>
<button onClick="{{go.login}}" class="lk" style="margin-top:6px">I already have an account</button>
</div>
</div>
</sc-if>

<!-- SIGN UP -->
<sc-if value="{{is.signup}}" hint-placeholder-val="{{false}}">
<div class="scr">
<div class="top"><button onClick="{{go.welcome}}" class="bk"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>Back</button><span class="mono d">01 / Account</span></div>
<div class="body" style="gap:30px; padding-top:20px">
<h1 class="t rise">Create<br>account</h1>
<div style="display:flex; flex-direction:column; gap:26px">
<div><label for="su-email" class="mono d">UTSA email</label><input id="su-email" class="inp" type="email" autocomplete="email" value="{{email}}" onChange="{{onEmail}}"></div>
<div><label for="su-pass" class="mono d">Password · 8+ characters</label><input id="su-pass" class="inp" type="password" autocomplete="new-password" value="{{password}}" onChange="{{onPassword}}"></div>
</div>
<button role="checkbox" aria-checked="{{terms.pressed}}" onClick="{{terms.toggle}}" style="display:flex; align-items:flex-start; gap:14px; border:0; background:transparent; color:#8B8F9A; font-family:inherit; text-align:left; padding:0; cursor:pointer">
<span style="width:18px; height:18px; flex:none; margin-top:2px; border-radius:50%; border:1px solid {{terms.bd}}; background:{{terms.bg}}; box-shadow:{{terms.glow}}"></span>
<span style="font-size:13px; line-height:1.6; font-weight:300">I agree to the Terms of Use and Privacy Policy, and understand {{appName}} gives general fitness guidance, not medical advice.</span>
</button>
<sc-if value="{{hasAuthError}}" hint-placeholder-val="{{false}}"><div role="alert" class="note" style="color:#FFA57A"><span class="dot" style="background:#FF6B2C"></span>{{authError}}</div></sc-if>
<div class="mono d" style="font-size:9px">Demo · Test@Mail.com / TESTING123</div>
</div>
<div class="foot"><button onClick="{{signUp}}" class="go"><span>Create account</span><span class="orb"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></span></button></div>
</div>
</sc-if>

<!-- VERIFY -->
<sc-if value="{{is.verify}}" hint-placeholder-val="{{false}}">
<div class="scr">
<div class="top"><button onClick="{{go.signup}}" class="bk"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>Back</button><span class="mono d">02 / Verify</span></div>
<div class="body" style="justify-content:center; gap:22px">
<span class="mono bl" style="display:flex; align-items:center; gap:10px"><span class="live"></span>Link sent</span>
<h1 class="t rise">Check your<br>inbox</h1>
<p class="p">We sent a link to <span class="w">{{email}}</span>. Open it on this phone to unlock your account.</p>
<sc-if value="{{resent}}" hint-placeholder-val="{{false}}"><div role="status" class="note bl"><span class="dot" style="background:#5B8CFF"></span>A new link is on its way.</div></sc-if>
</div>
<div class="foot"><button onClick="{{go.intro}}" class="go"><span>I opened the link</span><span class="orb"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></span></button><button onClick="{{resend}}" class="lk">Resend email</button></div>
</div>
</sc-if>

<!-- INTRO -->
<sc-if value="{{is.intro}}" hint-placeholder-val="{{false}}">
<div class="scr">
<div class="top"><span class="mono d">{{intro.pos}}</span><button onClick="{{startQuiz}}" class="lk">Skip</button></div>
<div class="body" style="justify-content:center; gap:20px">
<div class="disp o rise" style="font-size:130px; line-height:.85; text-shadow:0 0 50px rgba(255,107,44,.45)">{{intro.num}}</div>
<span class="mono m">{{intro.kicker}}</span>
<h1 class="t rise2" style="font-size:30px">{{intro.title}}</h1>
<p class="p rise3">{{intro.body}}</p>
<sc-if value="{{intro.last}}" hint-placeholder-val="{{false}}"><p class="p" style="font-size:13px; padding-top:16px; border-top:1px solid rgba(255,255,255,.08)">{{appName}} gives general fitness guidance, not medical advice. Check with a doctor before starting if you have a health condition.</p></sc-if>
</div>
<div class="foot">
<div style="display:flex; gap:6px; margin-bottom:14px"><sc-for list="{{intro.dots}}" as="d" hint-placeholder-count="3"><span style="height:2px; width:{{d.w}}px; border-radius:1px; background:{{d.bg}}"></span></sc-for></div>
<button onClick="{{introNext}}" class="go"><span>{{intro.cta}}</span><span class="orb"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></span></button>
</div>
</div>
</sc-if>

<!-- SETUP -->
<sc-if value="{{isSetupForm}}" hint-placeholder-val="{{false}}">
<div class="scr">
<div class="top"><button onClick="{{setup.back}}" class="bk"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>Back</button>
<sc-if value="{{setup.editing}}" hint-placeholder-val="{{false}}"><button onClick="{{setup.done}}" class="bk o">Done</button></sc-if>
<sc-if value="{{setup.notEditing}}" hint-placeholder-val="{{true}}"><span class="mono d">{{setup.counter}}</span></sc-if>
</div>
<div style="position:relative; height:1px; background:rgba(255,255,255,.08)"><div style="height:1px; width:{{setup.pct}}%; background:#FF6B2C; box-shadow:0 0 8px #FF6B2C; transition:width .4s"></div><span style="position:absolute; top:-3px; left:{{setup.pct}}%; width:7px; height:7px; margin-left:-4px; border-radius:50%; background:#FF6B2C; box-shadow:0 0 10px #FF6B2C; transition:left .4s"></span></div>
<div class="body" style="padding-top:34px; gap:26px">

<sc-if value="{{is.quiz}}" hint-placeholder-val="{{true}}">
<div class="rise">
<div class="mono o">{{quiz.section}}</div>
<h1 style="margin:16px 0 0; font-size:27px; line-height:1.25; font-weight:300; letter-spacing:-.02em">{{quiz.title}}</h1>
<sc-if value="{{quiz.hasNote}}" hint-placeholder-val="{{false}}"><p class="p" style="margin-top:12px; font-size:13px">{{quiz.note}}</p></sc-if>
</div>
<div class="rise2" style="border-top:1px solid rgba(255,255,255,.07)">
<sc-for list="{{quiz.options}}" as="o" hint-placeholder-count="4">
<button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" class="li" style="padding:17px 0; color:{{o.fg}}"><span class="dot" style="width:9px; height:9px; border:1px solid {{o.dotBd}}; background:{{o.dot}}; box-shadow:{{o.glow}}"></span><span style="flex:1; font-size:17px; font-weight:300">{{o.label}}</span></button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{is.upload}}" hint-placeholder-val="{{false}}">
<h1 class="t">Your class<br>schedule</h1>
<p class="p">We place workouts in the gaps between your classes.</p>
<button onClick="{{chooseFile}}" style="align-self:center; margin-top:10px; position:relative; width:210px; height:210px; border-radius:50%; border:1px solid rgba(255,255,255,.12); background:transparent; color:#F5F5F7; font-family:inherit; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; cursor:pointer">
<svg class="spin" viewBox="0 0 210 210" width="210" height="210" aria-hidden="true" style="position:absolute; inset:-1px"><circle cx="105" cy="105" r="104" fill="none" stroke="#5B8CFF" stroke-width="1.5" stroke-dasharray="70 584" stroke-linecap="round" style="filter:drop-shadow(0 0 6px #5B8CFF)"></circle></svg>
<span class="disp" style="font-size:38px">+</span><span style="font-size:15px">Choose PDF</span><span class="mono d" style="font-size:9px">ASAP · 10 MB max</span>
</button>
<sc-if value="{{hasFile}}" hint-placeholder-val="{{false}}"><div class="note" style="justify-content:space-between; padding:16px 0; border-top:1px solid rgba(255,255,255,.07); border-bottom:1px solid rgba(255,255,255,.07)"><span>{{fileName}}</span><span class="mono bl" style="display:flex; align-items:center; gap:8px"><span class="live"></span>Ready</span></div></sc-if>
<button onClick="{{skipUpload}}" class="lk">Skip for now, add classes later</button>
</sc-if>

<sc-if value="{{is.confirm}}" hint-placeholder-val="{{false}}">
<div><span class="mono bl">Scan complete</span><h1 class="t" style="margin-top:14px">Check your<br>classes</h1><p class="p" style="margin-top:14px">We found {{foundCount}}. Tap any that look wrong to remove them.</p></div>
<div style="border-top:1px solid rgba(255,255,255,.07)">
<sc-for list="{{classRows}}" as="c" hint-placeholder-count="5">
<button onClick="{{c.toggle}}" aria-pressed="{{c.pressed}}" class="li" style="opacity:{{c.op}}"><span style="flex:1; display:flex; flex-direction:column; gap:6px"><span style="font-size:16px; font-weight:400; text-decoration:{{c.strike}}">{{c.name}}</span><span class="mono d" style="font-size:9px; letter-spacing:.12em">{{c.code}} · {{c.when}}</span></span><span class="mono" style="color:{{c.tagFg}}">{{c.tag}}</span></button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{is.diet}}" hint-placeholder-val="{{false}}">
<div><h1 class="t">Food needs</h1><p class="p" style="margin-top:14px">Pick everything that applies. These filter your meals.</p></div>
<sc-for list="{{dietSections}}" as="sec" hint-placeholder-count="3">
<div style="display:flex; flex-direction:column; gap:14px">
<div class="mono d">{{sec.label}}</div>
<div style="display:flex; flex-wrap:wrap; gap:8px"><sc-for list="{{sec.options}}" as="ch" hint-placeholder-count="5"><button onClick="{{ch.pick}}" aria-pressed="{{ch.pressed}}" class="chip" style="border:1px solid {{ch.bd}}; color:{{ch.fg}}"><span class="dot" style="width:6px; height:6px; background:{{ch.dot}}; box-shadow:{{ch.glow}}"></span>{{ch.label}}</button></sc-for></div>
</div>
</sc-for>
<p class="p" style="font-size:13px">Always confirm allergens with dining staff.</p>
</sc-if>

<sc-if value="{{is.mealplan}}" hint-placeholder-val="{{false}}">
<div><h1 class="t">Meal plan</h1><p class="p" style="margin-top:14px">Sets your starting balances. You log what you use.</p></div>
<div style="border-top:1px solid rgba(255,255,255,.07)">
<sc-for list="{{planRows}}" as="p" hint-placeholder-count="7">
<button onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" class="li" style="color:{{p.fg}}"><span class="dot" style="width:9px; height:9px; border:1px solid {{p.dotBd}}; background:{{p.dot}}; box-shadow:{{p.glow}}"></span><span style="flex:1; display:flex; flex-direction:column; gap:6px"><span style="font-size:16px">{{p.name}}</span><span style="font-size:12px; line-height:1.5; font-weight:300" class="d">{{p.desc}}</span></span></button>
</sc-for>
</div>
</sc-if>

</div>
<div class="foot">
<sc-if value="{{setup.enabled}}" hint-placeholder-val="{{true}}"><button onClick="{{setup.next}}" class="go"><span>{{setup.cta}}</span><span class="orb"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></span></button></sc-if>
<sc-if value="{{setup.disabled}}" hint-placeholder-val="{{false}}"><button disabled="true" class="go"><span>{{setup.cta}}</span><span class="orb"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></span></button></sc-if>
</div>
</div>
</sc-if>

<!-- GATE -->
<sc-if value="{{is.gate}}" hint-placeholder-val="{{false}}">
<div class="scr">
<div class="top"><span class="mono o" style="display:flex; align-items:center; gap:10px"><span class="live liveo"></span>Safety check</span><span class="mono d">Plan paused</span></div>
<div class="body" style="justify-content:center; gap:22px">
<h1 class="t rise">Check with<br>a doctor<br>first</h1>
<p class="p">You told us a doctor has limited your exercise, or you get chest pain or dizziness when you exert yourself. Your plan is paused until you're cleared. UTSA Student Health Services can help.</p>
</div>
<div class="foot"><button onClick="{{gateCleared}}" class="go"><span>A doctor has cleared me</span><span class="orb"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="M5 12l5 5 9-10"></path></svg></span></button><button onClick="{{gateChange}}" class="lk">Change my answer</button></div>
</div>
</sc-if>

<!-- BUILDING -->
<sc-if value="{{is.building}}" hint-placeholder-val="{{false}}">
<div class="scr" style="justify-content:center; align-items:center; gap:46px">
<div style="position:relative; width:250px; height:250px">
<svg viewBox="0 0 250 250" width="250" height="250" aria-hidden="true" style="position:absolute; inset:0"><circle cx="125" cy="125" r="120" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1"></circle><circle cx="125" cy="125" r="120" fill="none" stroke="#FF6B2C" stroke-width="2" stroke-linecap="round" stroke-dasharray="753.98" stroke-dashoffset="{{build.off}}" transform="rotate(-90 125 125)" style="transition:stroke-dashoffset .6s ease; filter:drop-shadow(0 0 8px #FF6B2C)"></circle></svg>
<div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px"><span class="disp" style="font-size:64px">{{build.pct}}</span><span class="mono d">Percent</span></div>
</div>
<div role="status" style="width:100%; display:flex; flex-direction:column; gap:14px">
<sc-for list="{{build.items}}" as="b" hint-placeholder-count="4"><div class="mono" style="display:flex; align-items:center; gap:14px; letter-spacing:.14em; color:{{b.fg}}"><span class="dot" style="width:5px; height:5px; background:{{b.dot}}; box-shadow:{{b.glow}}"></span>{{b.label}}</div></sc-for>
</div>
</div>
</sc-if>

<!-- READY -->
<sc-if value="{{is.ready}}" hint-placeholder-val="{{false}}">
<div class="scr">
<div class="top"><span class="mono bl" style="display:flex; align-items:center; gap:10px"><span class="live"></span>Plan ready</span><span class="mono d">Week 01</span></div>
<div class="body" style="gap:28px; padding-top:20px">
<div class="rise"><h1 class="t">{{plan.splitTitle}}</h1><p class="mono d" style="margin:16px 0 0; font-size:9px; line-height:1.8">{{plan.meta}}</p></div>
<div class="rise2" style="border-top:1px solid rgba(255,255,255,.07)">
<sc-for list="{{week}}" as="w" hint-placeholder-count="7"><div class="li" style="cursor:default; padding:15px 0"><span class="mono" style="width:40px; color:{{w.dayFg}}">{{w.day}}</span><span style="flex:1; font-size:17px; font-weight:300; color:{{w.fg}}">{{w.focus}}</span><span class="mono d" style="font-size:9px">{{w.time}}</span></div></sc-for>
</div>
</div>
<div class="foot"><button onClick="{{goHome}}" class="go"><span>Start week one</span><span class="orb"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></span></button></div>
</div>
</sc-if>

<!-- APP -->
<sc-if value="{{inShell}}" hint-placeholder-val="{{false}}">
<div class="scr">
<div class="top">
<span class="mono w">{{header.title}}</span>
<sc-if value="{{hasSubTabs}}" hint-placeholder-val="{{true}}"><div role="tablist" aria-label="Sections" style="display:flex; gap:16px"><sc-for list="{{subTabs}}" as="s" hint-placeholder-count="3"><button role="tab" aria-selected="{{s.sel}}" onClick="{{s.pick}}" class="mono" style="position:relative; min-height:44px; border:0; background:transparent; padding:0; color:{{s.fg}}; letter-spacing:.14em; cursor:pointer; transition:color .3s">{{s.label}}<span style="position:absolute; left:50%; bottom:6px; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:{{s.dot}}; box-shadow:{{s.glow}}"></span></button></sc-for></div></sc-if>
<sc-if value="{{noSubTabs}}" hint-placeholder-val="{{false}}"><span class="mono d">{{header.sub}}</span></sc-if>
</div>
<div class="body" onPointerDown="{{swStart}}" onPointerUp="{{swEnd}}" style="padding-bottom:120px; touch-action:pan-y">

<!-- TODAY: SESSION -->
<sc-if value="{{sub.todayWorkout}}" hint-placeholder-val="{{true}}">
<div class="view" style="animation-name:{{anim}}">
<sc-if value="{{today.isWorkout}}" hint-placeholder-val="{{true}}">
<div style="flex:1; display:flex; flex-direction:column; justify-content:center; gap:20px; min-height:500px">
<span class="mono o rise" style="display:flex; align-items:center; gap:10px"><span class="live liveo"></span>{{today.when}} · Rec Center</span>
<h1 class="disp rise" style="margin:0; font-size:{{today.focusSize}}px; line-height:.92; text-shadow:0 0 60px rgba(255,255,255,.12)">{{today.focus}}</h1>
<p class="p rise2">{{today.short}}</p>
<button onClick="{{openProgress}}" class="mono rise2" style="align-self:flex-start; min-height:36px; border:0; background:transparent; padding:0; color:#5C606B; cursor:pointer">Streak <span class="w">{{streakPad}}</span> · Best {{longest}}</button>
<sc-if value="{{showCheckin}}" hint-placeholder-val="{{true}}"><button onClick="{{go.checkin}}" class="li rise3" style="border-top:1px solid rgba(255,255,255,.07); margin-top:10px"><span class="live"></span><span style="flex:1; font-size:15px; font-weight:300">Two-week check-in ready</span><span class="mono bl">2 min</span></button></sc-if>
</div>
<button onClick="{{today.open}}" class="go rise3"><span>{{today.cta}}</span><span class="orb"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></span></button>
</sc-if>
<sc-if value="{{today.isRest}}" hint-placeholder-val="{{false}}">
<div style="flex:1; display:flex; flex-direction:column; justify-content:center; gap:20px; min-height:500px">
<span class="mono bl" style="display:flex; align-items:center; gap:10px"><span class="live"></span>Recovery</span>
<h1 class="disp d" style="margin:0; font-size:96px; line-height:.9">Rest</h1>
<p class="p">{{today.restNote}}</p>
</div>
</sc-if>
</div>
</sc-if>

<!-- TODAY: MEAL -->
<sc-if value="{{sub.todayMeal}}" hint-placeholder-val="{{false}}">
<div class="view" style="animation-name:{{anim}}">
<div style="flex:1; display:flex; flex-direction:column; justify-content:center; gap:18px; min-height:500px">
<span class="mono o rise" style="display:flex; align-items:center; gap:10px"><span class="live liveo"></span>Next · {{nextMeal.mode}}</span>
<div class="rise" style="display:flex; align-items:baseline; gap:14px"><span class="disp o" style="font-size:120px; line-height:.85; text-shadow:0 0 50px rgba(255,107,44,.45)">{{nextMeal.key}}</span><span class="mono m">{{nextMeal.keyLabel}}</span></div>
<span class="rise2" style="font-size:24px; font-weight:300; line-height:1.3; letter-spacing:-.01em">{{nextMeal.name}}</span>
<span class="mono d rise2" style="font-size:9px">{{nextMeal.place}} · {{nextMeal.pay}}</span>
<button onClick="{{seeMeals}}" class="lk rise3" style="align-self:flex-start">All meals</button>
</div>
<button onClick="{{nextMeal.open}}" class="go"><span>Open meal</span><span class="orb"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></span></button>
</div>
</sc-if>

<!-- TODAY: CLASSES -->
<sc-if value="{{sub.todayClasses}}" hint-placeholder-val="{{false}}">
<div class="view" style="animation-name:{{anim}}">
<h1 class="t rise" style="margin:20px 0 26px">Between<br>classes</h1>
<sc-if value="{{hasClasses}}" hint-placeholder-val="{{true}}"><div style="border-top:1px solid rgba(255,255,255,.07)"><sc-for list="{{todayClasses}}" as="c" hint-placeholder-count="2"><div class="li" style="cursor:default"><span class="mono bl" style="width:74px; letter-spacing:.08em">{{c.start}}</span><span style="flex:1; display:flex; flex-direction:column; gap:6px"><span style="font-size:17px; font-weight:300">{{c.name}}</span><span class="mono d" style="font-size:9px">{{c.code}} · until {{c.end}}</span></span></div></sc-for></div></sc-if>
<sc-if value="{{noClasses}}" hint-placeholder-val="{{false}}"><p class="p">{{noClassesText}}</p></sc-if>
</div>
</sc-if>

<!-- TRAIN -->
<sc-if value="{{view.train}}" hint-placeholder-val="{{false}}">
<div class="view" style="animation-name:{{anim}}">
<h1 class="t rise" style="margin:20px 0 26px">{{plan.splitTitle}}</h1>
<sc-if value="{{hasMoveMsg}}" hint-placeholder-val="{{false}}"><div role="status" class="note bl" style="margin-bottom:16px"><span class="dot" style="background:#5B8CFF; box-shadow:0 0 8px #5B8CFF"></span>{{moveMsg}}</div></sc-if>
<div class="rise2" style="border-top:1px solid rgba(255,255,255,.07)">
<sc-for list="{{week}}" as="w" hint-placeholder-count="7">
<button onClick="{{w.open}}" class="li" style="cursor:{{w.cursor}}"><span class="mono" style="width:40px; color:{{w.dayFg}}">{{w.day}}</span><span class="dot" style="width:6px; height:6px; background:{{w.dot}}; box-shadow:{{w.glow}}"></span><span style="flex:1; font-size:19px; font-weight:300; letter-spacing:-.01em; color:{{w.fg}}">{{w.focus}}</span><span class="mono" style="font-size:9px; color:{{w.tagFg}}">{{w.right}}</span></button>
</sc-for>
</div>
</div>
</sc-if>

<!-- PROGRESS -->
<sc-if value="{{view.progress}}" hint-placeholder-val="{{false}}">
<sc-if value="{{sub.progStreak}}" hint-placeholder-val="{{true}}">
<div class="view" style="animation-name:{{anim}}">
<div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px; min-height:560px">
<div class="rise" style="position:relative; width:300px; height:300px">
<svg viewBox="0 0 300 300" width="300" height="300" aria-hidden="true" style="position:absolute; inset:0"><circle cx="150" cy="150" r="140" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1"></circle><circle cx="150" cy="150" r="140" fill="none" stroke="#FF6B2C" stroke-width="2" stroke-linecap="round" stroke-dasharray="879.65" stroke-dashoffset="{{ring.streak}}" transform="rotate(-90 150 150)" style="filter:drop-shadow(0 0 8px #FF6B2C)"></circle></svg>
<div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px"><span class="disp" style="font-size:150px; line-height:.85; text-shadow:0 0 60px rgba(255,107,44,.35)">{{streak}}</span><span class="mono m">Day streak</span></div>
</div>
<div class="mono d rise2" style="display:flex; gap:22px"><span>Best <span class="w">{{longest}}</span></span><span>To beat <span class="o">{{toBeat}}</span></span></div>
<p class="p rise3" style="font-size:13px; text-align:center; max-width:290px">Rest days never break your streak. Missed a workout? Move it to another day.</p>
</div>
</div>
</sc-if>
<sc-if value="{{sub.progCalendar}}" hint-placeholder-val="{{false}}">
<div class="view" style="animation-name:{{anim}}">
<h1 class="t rise" style="margin:20px 0 34px">October</h1>
<div class="rise2" style="display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); row-gap:18px">
<sc-for list="{{weekLetters}}" as="l" hint-placeholder-count="7"><div class="mono d" style="text-align:center; letter-spacing:0; font-size:9px">{{l.t}}</div></sc-for>
<sc-for list="{{calCells}}" as="c" hint-placeholder-count="34"><div aria-label="{{c.aria}}" style="height:30px; display:flex; align-items:center; justify-content:center; visibility:{{c.vis}}"><span style="width:{{c.size}}px; height:{{c.size}}px; border-radius:50%; background:{{c.bg}}; border:{{c.border}}; box-shadow:{{c.glow}}; animation:{{c.anim}}"></span></div></sc-for>
</div>
<div class="mono d rise3" style="display:flex; gap:20px; margin-top:38px; font-size:9px"><span style="display:flex; align-items:center; gap:8px"><span class="dot" style="background:#FF6B2C; box-shadow:0 0 8px #FF6B2C"></span>Done</span><span style="display:flex; align-items:center; gap:8px"><span class="dot" style="border:1px solid #5B8CFF"></span>Missed</span><span style="display:flex; align-items:center; gap:8px"><span class="dot" style="width:4px; height:4px; background:rgba(255,255,255,.3)"></span>Rest</span></div>
</div>
</sc-if>
<sc-if value="{{sub.progStats}}" hint-placeholder-val="{{false}}">
<div class="view" style="animation-name:{{anim}}">
<h1 class="t rise" style="margin:20px 0 26px">Since<br>Oct 1</h1>
<div class="rise2" style="border-top:1px solid rgba(255,255,255,.07)"><sc-for list="{{stats}}" as="s" hint-placeholder-count="3"><div class="li" style="cursor:default; padding:24px 0"><span class="mono m" style="flex:1">{{s.label}}</span><span class="disp" style="font-size:40px">{{s.value}}</span></div></sc-for></div>
</div>
</sc-if>
</sc-if>

<!-- EAT -->
<sc-if value="{{view.eat}}" hint-placeholder-val="{{false}}">
<sc-if value="{{sub.eatMeals}}" hint-placeholder-val="{{true}}">
<div class="view" style="animation-name:{{anim}}">
<h1 class="t rise" style="margin:20px 0 12px">{{eatTitle}}</h1>
<p class="p rise" style="font-size:14px; margin-bottom:22px">{{modeHint}}</p>
<div class="rise2" style="border-top:1px solid rgba(255,255,255,.07)">
<sc-for list="{{meals}}" as="m" hint-placeholder-count="8">
<button onClick="{{m.open}}" class="li">
<span class="disp" style="width:66px; font-size:22px; color:{{m.keyFg}}">{{m.keyVal}}</span>
<span style="flex:1; min-width:0; display:flex; flex-direction:column; gap:6px"><span style="font-size:15px; font-weight:400; line-height:1.3">{{m.name}}</span><span class="mono" style="font-size:8.5px; letter-spacing:.12em"><span class="d">{{m.place}} · </span><span style="color:{{m.payFg}}">{{m.pay}}</span></span></span>
<sc-if value="{{m.isLogged}}" hint-placeholder-val="{{false}}"><span class="live"></span></sc-if>
</button>
</sc-for>
</div>
<p class="p" style="font-size:11px; margin-top:18px; color:#4A4E58">Café nutrition from UTSA Dining. Chain items use each brand's published nutrition. Confirm allergens with staff.</p>
</div>
</sc-if>
<sc-if value="{{sub.eatBalances}}" hint-placeholder-val="{{false}}">
<div class="view" style="animation-name:{{anim}}">
<h1 class="t rise" style="margin:20px 0 26px">{{planName}}</h1>
<div class="rise2" style="border-top:1px solid rgba(255,255,255,.07)"><sc-for list="{{balances}}" as="b" hint-placeholder-count="3"><div style="padding:26px 0; border-bottom:1px solid rgba(255,255,255,.07); display:flex; flex-direction:column; gap:10px"><div style="display:flex; justify-content:space-between"><span class="mono m">{{b.label}}</span><span class="mono d" style="font-size:9px">{{b.note}}</span></div><span class="disp" style="font-size:52px; line-height:1; color:{{b.fg}}">{{b.value}}</span></div></sc-for></div>
<p class="p" style="font-size:13px; margin-top:18px">Log meals and these update. Trades reset every Monday.</p>
</div>
</sc-if>
</sc-if>

<!-- ME -->
<sc-if value="{{view.me}}" hint-placeholder-val="{{false}}">
<sc-if value="{{sub.meList}}" hint-placeholder-val="{{true}}">
<div class="view" style="animation-name:{{anim}}">
<div class="rise" style="margin:20px 0 30px; display:flex; flex-direction:column; gap:12px"><span class="disp" style="font-size:26px; letter-spacing:-.04em; word-break:break-all">{{email}}</span><span class="mono d" style="font-size:9px">UTSA · {{planName}}</span></div>
<div class="rise2" style="border-top:1px solid rgba(255,255,255,.07)"><sc-for list="{{meRows}}" as="r" hint-placeholder-count="2"><button onClick="{{r.open}}" class="li" style="padding:22px 0"><span style="flex:1; display:flex; flex-direction:column; gap:7px"><span style="font-size:18px; font-weight:300">{{r.label}}</span><span class="mono d" style="font-size:9px; letter-spacing:.1em">{{r.sub}}</span></span><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="fill:none; stroke:#FF6B2C; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></button></sc-for></div>
</div>
</sc-if>
<sc-if value="{{sub.meSettings}}" hint-placeholder-val="{{false}}">
<div class="view" style="animation-name:{{anim}}">
<h1 class="t rise" style="margin:20px 0 26px">Settings</h1>
<div class="rise2" style="border-top:1px solid rgba(255,255,255,.07)"><sc-for list="{{switches}}" as="n" hint-placeholder-count="3"><button role="switch" aria-checked="{{n.pressed}}" onClick="{{n.toggle}}" class="li" style="padding:22px 0"><span style="flex:1; display:flex; flex-direction:column; gap:7px"><span style="font-size:18px; font-weight:300">{{n.label}}</span><span style="font-size:12px; font-weight:300" class="d">{{n.sub}}</span></span><span style="width:44px; height:24px; flex:none; border-radius:12px; border:1px solid {{n.bd}}; background:{{n.track}}; box-shadow:{{n.glow}}; position:relative; transition:all .25s"><span style="position:absolute; top:3px; left:{{n.knob}}px; width:16px; height:16px; border-radius:50%; background:{{n.knobBg}}; transition:left .25s"></span></span></button></sc-for></div>
<button onClick="{{logout}}" class="lk" style="margin-top:20px">Log out</button>
</div>
</sc-if>
</sc-if>

<!-- WORKOUT DETAIL -->
<sc-if value="{{view.workoutDetail}}" hint-placeholder-val="{{false}}">
<div class="view" style="animation-name:{{anim}}">
<button onClick="{{backToTrain}}" class="bk" style="align-self:flex-start"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>Week</button>
<div class="rise" style="margin:22px 0 30px"><span class="mono o">{{detail.dayLabel}}</span><h1 class="disp" style="margin:14px 0 0; font-size:{{detail.size}}px; line-height:.95">{{detail.focus}}</h1><p class="mono d" style="margin:16px 0 0; font-size:9px; line-height:1.8">{{detail.meta}}</p></div>
<div class="rise2" style="border-top:1px solid rgba(255,255,255,.07)"><sc-for list="{{exList}}" as="e" hint-placeholder-count="5"><div class="li" style="cursor:default; align-items:flex-start"><span class="mono o" style="width:26px; padding-top:4px">{{e.numPad}}</span><span style="flex:1; display:flex; flex-direction:column; gap:7px"><span style="font-size:17px; font-weight:300">{{e.name}}</span><span class="mono d" style="font-size:9px; letter-spacing:.1em">{{e.sets}} × {{e.reps}} · rest {{e.rest}}</span><span style="font-size:12px; font-weight:300" class="bl">{{e.equip}}</span></span></div></sc-for></div>
<div style="margin-top:24px"><button onClick="{{startWorkout}}" class="go"><span>Start workout</span><span class="orb"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill:currentColor"><path d="M8 5v14l11-7z"></path></svg></span></button><button onClick="{{moveWorkout}}" class="lk">Move to another day</button></div>
</div>
</sc-if>

<!-- MEAL DETAIL -->
<sc-if value="{{view.mealDetail}}" hint-placeholder-val="{{false}}">
<div class="view" style="animation-name:{{anim}}">
<button onClick="{{backToEat}}" class="bk" style="align-self:flex-start"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>Meals</button>
<div class="rise" style="margin:22px 0 0; display:flex; align-items:center; gap:14px">
<span style="width:40px; height:40px; flex:none; border-radius:50%; background:{{meal.tileBg}}; display:flex; align-items:center; justify-content:center; overflow:hidden; font:400 11px 'Unbounded'; color:#F5F5F7">
<sc-if value="{{meal.isCafe}}" hint-placeholder-val="{{false}}"><img src="utsa-dining.png" alt="UTSA Dining" style="width:40px; height:40px; object-fit:contain; filter:{{imgFilter}}"></sc-if>
<sc-if value="{{meal.isChain}}" hint-placeholder-val="{{true}}">{{meal.initials}}</sc-if>
</span>
<span class="mono m" style="font-size:9px; line-height:1.8">{{meal.place}}<br><span class="d">{{meal.bld}}</span></span>
</div>
<h1 class="rise" style="margin:22px 0 0; font-size:28px; line-height:1.2; font-weight:300; letter-spacing:-.02em">{{meal.name}}</h1>
<p class="p rise2" style="margin-top:12px; font-size:14px">{{meal.desc}}</p>
<div class="rise2" style="display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); margin:30px 0; border-top:1px solid rgba(255,255,255,.07); border-bottom:1px solid rgba(255,255,255,.07); padding:20px 0">
<div><div class="disp o" style="font-size:24px; text-shadow:0 0 20px rgba(255,107,44,.5)">{{meal.p}}g</div><div class="mono d" style="margin-top:8px; font-size:8.5px; letter-spacing:.12em">Protein</div></div>
<div><div class="disp" style="font-size:24px">{{meal.c}}g</div><div class="mono d" style="margin-top:8px; font-size:8.5px; letter-spacing:.12em">Carbs</div></div>
<div><div class="disp" style="font-size:24px">{{meal.cal}}</div><div class="mono d" style="margin-top:8px; font-size:8.5px; letter-spacing:.12em">Cal</div></div>
<div><div class="disp" style="font-size:24px">{{meal.fiber}}</div><div class="mono d" style="margin-top:8px; font-size:8.5px; letter-spacing:.12em">Fiber</div></div>
</div>
<div style="display:flex; flex-direction:column; gap:14px">
<div style="display:flex; justify-content:space-between; gap:12px; font-size:14px; font-weight:300"><span class="mono d">Pay</span><span style="text-align:right">{{meal.cost}}</span></div>
<div style="display:flex; justify-content:space-between; gap:12px; font-size:14px; font-weight:300"><span class="mono d">Hours</span><span style="text-align:right">{{meal.hours}}</span></div>
<div style="display:flex; justify-content:space-between; gap:12px; font-size:14px; font-weight:300"><span class="mono d">Allergens</span><span style="text-align:right">{{meal.allergens}}</span></div>
</div>
<p class="p" style="margin-top:18px; font-size:11px; color:#4A4E58">Confirm allergens with dining staff before ordering.</p>
<sc-if value="{{hasLogMsg}}" hint-placeholder-val="{{false}}"><div role="status" class="note bl" style="margin-top:14px"><span class="dot" style="background:#5B8CFF; box-shadow:0 0 8px #5B8CFF"></span>{{logMsg}}</div></sc-if>
<div style="margin-top:20px">
<sc-if value="{{meal.notLogged}}" hint-placeholder-val="{{true}}"><button onClick="{{meal.log}}" class="go"><span>Log this meal</span><span class="orb"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></span></button></sc-if>
<sc-if value="{{meal.isLogged}}" hint-placeholder-val="{{false}}"><button disabled="true" class="go"><span>Logged today</span><span class="orb"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="M5 12l5 5 9-10"></path></svg></span></button></sc-if>
</div>
</div>
</sc-if>

</div>

<!-- MENU TRIGGER -->
<button onClick="{{openMenu}}" aria-label="Open menu" style="position:absolute; left:50%; bottom:calc(28px + env(safe-area-inset-bottom)); width:52px; height:52px; margin-left:-26px; border-radius:50%; border:1px solid rgba(255,255,255,.18); background:rgba(0,0,0,.6); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; cursor:pointer">
<span style="width:16px; height:1px; background:#F5F5F7"></span><span style="width:8px; height:1px; background:#FF6B2C; box-shadow:0 0 6px #FF6B2C"></span>
</button>

<!-- MENU -->
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<div style="position:absolute; inset:0; background:rgba(0,0,0,.96); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); display:flex; flex-direction:column; padding:env(safe-area-inset-top) 28px env(safe-area-inset-bottom); animation:fade .25s ease both">
<div class="top"><span class="mono w">{{appName}}</span><span class="mono d">Mon 10.19</span></div>
<nav aria-label="Main" style="flex:1; display:flex; flex-direction:column; justify-content:center">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<button onClick="{{t.go}}" aria-current="{{t.cur}}" class="rise" style="width:100%; display:flex; align-items:baseline; gap:18px; border:0; background:transparent; padding:14px 0; color:{{t.fg}}; font-family:inherit; text-align:left; cursor:pointer; animation-delay:{{t.delay}}ms">
<span class="mono d" style="width:22px">{{t.idx}}</span>
<span style="flex:1; display:flex; flex-direction:column; gap:8px"><span class="disp" style="font-size:44px; line-height:1; text-shadow:{{t.glow}}">{{t.label}}</span><span class="mono d" style="font-size:9px; letter-spacing:.12em">{{t.sub}}</span></span>
</button>
</sc-for>
</nav>
<button onClick="{{closeMenu}}" aria-label="Close menu" style="align-self:center; margin-bottom:28px; width:52px; height:52px; border-radius:50%; border:1px solid rgba(255,255,255,.18); background:transparent; color:#F5F5F7; display:flex; align-items:center; justify-content:center; cursor:pointer"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:1.4; stroke-linecap:round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
</div>
</sc-if>
</div>
</sc-if>

<!-- ACTIVE -->
<sc-if value="{{is.active}}" hint-placeholder-val="{{false}}">
<div class="scr">
<div class="top"><button onClick="{{endWorkout}}" class="bk">End</button><span class="mono o" style="display:flex; align-items:center; gap:10px"><span class="live liveo"></span>{{active.pos}}</span></div>
<div style="height:1px; background:rgba(255,255,255,.08)"><div style="height:1px; width:{{active.pct}}%; background:#FF6B2C; box-shadow:0 0 8px #FF6B2C; transition:width .4s"></div></div>
<div class="body" style="justify-content:center; gap:40px">
<div class="rise"><h1 class="t" style="font-size:38px">{{active.name}}</h1><p class="mono d" style="margin:16px 0 0; font-size:9px; line-height:1.8">{{activeReps}} reps · {{active.equip}} · rest {{active.rest}}</p></div>
<div class="rise2" style="display:flex; flex-wrap:wrap; gap:14px">
<sc-for list="{{activeSets}}" as="s" hint-placeholder-count="4"><button onClick="{{s.toggle}}" aria-pressed="{{s.pressed}}" aria-label="{{s.label}}" style="width:68px; height:68px; border-radius:50%; border:1px solid {{s.bd}}; background:{{s.bg}}; box-shadow:{{s.glow}}; color:{{s.fg}}; font:200 24px 'Unbounded'; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .25s">{{s.n}}</button></sc-for>
</div>
<p class="mono d" style="margin:0; font-size:9px">Tap a set when it's done</p>
</div>
<div class="foot">
<sc-if value="{{active.notLast}}" hint-placeholder-val="{{true}}"><button onClick="{{activeNext}}" class="go"><span>Next exercise</span><span class="orb"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></span></button></sc-if>
<sc-if value="{{active.isLast}}" hint-placeholder-val="{{false}}"><button onClick="{{finishWorkout}}" class="go"><span>Finish workout</span><span class="orb"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="M5 12l5 5 9-10"></path></svg></span></button></sc-if>
<sc-if value="{{active.notFirst}}" hint-placeholder-val="{{true}}"><button onClick="{{activePrev}}" class="lk">Previous exercise</button></sc-if>
</div>
</div>
</sc-if>

<!-- COMPLETE -->
<sc-if value="{{is.complete}}" hint-placeholder-val="{{false}}">
<div class="scr">
<div class="top"><span class="mono bl" style="display:flex; align-items:center; gap:10px"><span class="live"></span>Session complete</span></div>
<div class="body" style="justify-content:center; align-items:center; text-align:center; gap:16px">
<span class="disp o rise" style="font-size:200px; line-height:.85; text-shadow:0 0 80px rgba(255,107,44,.6)">{{streak}}</span>
<span class="mono m">Day streak</span>
<p class="p rise2" style="margin-top:20px">{{setsDoneCount}} sets · {{exCount}} exercises<br>Next: <span class="w">{{nextSession}}</span></p>
</div>
<div class="foot"><button onClick="{{goHome}}" class="go"><span>Done</span><span class="orb"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="M5 12l5 5 9-10"></path></svg></span></button></div>
</div>
</sc-if>

<!-- CHECK-IN -->
<sc-if value="{{is.checkin}}" hint-placeholder-val="{{false}}">
<div class="scr">
<div class="top"><span class="mono bl" style="display:flex; align-items:center; gap:10px"><span class="live"></span>Check-in</span><button onClick="{{goHome}}" class="lk">Later</button></div>
<div class="body" style="gap:30px; padding-top:20px">
<h1 class="t rise">How's it<br>going?</h1>
<sc-for list="{{checkinQs}}" as="q" hint-placeholder-count="5">
<div style="display:flex; flex-direction:column; gap:14px"><div style="font-size:17px; font-weight:300">{{q.label}}</div><div style="display:flex; flex-wrap:wrap; gap:8px"><sc-for list="{{q.options}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" class="chip" style="border:1px solid {{o.bd}}; color:{{o.fg}}"><span class="dot" style="width:6px; height:6px; background:{{o.dot}}; box-shadow:{{o.glow}}"></span>{{o.label}}</button></sc-for></div></div>
</sc-for>
</div>
<div class="foot"><button onClick="{{submitCheckin}}" class="go"><span>Update my plan</span><span class="orb"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></span></button></div>
</div>
</sc-if>

<!-- PLAN UPDATE -->
<sc-if value="{{is.planUpdate}}" hint-placeholder-val="{{false}}">
<div class="scr">
<div class="top"><span class="mono bl" style="display:flex; align-items:center; gap:10px"><span class="live"></span>Plan recalibrated</span><span class="mono d">Next · Nov 2</span></div>
<div class="body" style="gap:26px; padding-top:20px">
<h1 class="t rise">What<br>changed</h1>
<div class="rise2" style="border-top:1px solid rgba(255,255,255,.07)"><sc-for list="{{changes}}" as="c" hint-placeholder-count="4"><div class="li" style="cursor:default; align-items:flex-start"><span style="flex:1; display:flex; flex-direction:column; gap:7px"><span style="font-size:17px; font-weight:300">{{c.title}}</span><span style="font-size:13px; font-weight:300; line-height:1.5" class="d">{{c.body}}</span></span><span class="mono" style="color:{{c.tagFg}}">{{c.tag}}</span></div></sc-for></div>
</div>
<div class="foot"><button onClick="{{goHome}}" class="go"><span>Back to Today</span><span class="orb"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></span></button></div>
</div>
</sc-if>

<!-- LOG IN -->
<sc-if value="{{is.login}}" hint-placeholder-val="{{false}}">
<div class="scr">
<div class="top"><button onClick="{{go.welcome}}" class="bk"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>Back</button><span class="mono d">Log in</span></div>
<div class="body" style="gap:30px; padding-top:20px">
<h1 class="t rise">Welcome<br><span class="o">back.</span></h1>
<div style="display:flex; flex-direction:column; gap:26px">
<div><label for="li-email" class="mono d">Email</label><input id="li-email" class="inp" type="email" autocomplete="email" value="{{loginEmail}}" onChange="{{onLoginEmail}}"></div>
<div><label for="li-pass" class="mono d">Password</label><input id="li-pass" class="inp" type="password" autocomplete="current-password" value="{{loginPassword}}" onChange="{{onLoginPassword}}"></div>
</div>
<button onClick="{{go.forgot}}" class="lk" style="align-self:flex-start">Forgot password?</button>
<sc-if value="{{hasLoginError}}" hint-placeholder-val="{{false}}"><div role="alert" class="note" style="color:#FFA57A"><span class="dot" style="background:#FF6B2C"></span>{{loginError}}</div></sc-if>
<div class="mono d" style="font-size:9px">Demo · Test@Mail.com / TESTING123</div>
</div>
<div class="foot"><button onClick="{{logIn}}" class="go"><span>Log in</span><span class="orb"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></span></button></div>
</div>
</sc-if>

<!-- FORGOT -->
<sc-if value="{{is.forgot}}" hint-placeholder-val="{{false}}">
<div class="scr">
<div class="top"><button onClick="{{go.login}}" class="bk"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>Back</button><span class="mono d">Reset</span></div>
<div class="body" style="gap:30px; padding-top:20px">
<div><h1 class="t">Reset<br>password</h1><p class="p" style="margin-top:14px">We'll email you a reset link.</p></div>
<sc-if value="{{forgotNotSent}}" hint-placeholder-val="{{true}}"><div><label for="fp-email" class="mono d">Email</label><input id="fp-email" class="inp" type="email" value="{{forgotEmail}}" onChange="{{onForgotEmail}}"></div></sc-if>
<sc-if value="{{forgotSent}}" hint-placeholder-val="{{false}}"><div role="status" class="note bl"><span class="dot" style="background:#5B8CFF; box-shadow:0 0 8px #5B8CFF"></span>If an account exists for {{forgotEmail}}, a link is on its way. It expires in 30 minutes.</div></sc-if>
</div>
<div class="foot">
<sc-if value="{{forgotNotSent}}" hint-placeholder-val="{{true}}"><button onClick="{{sendReset}}" class="go"><span>Send reset link</span><span class="orb"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></span></button></sc-if>
<sc-if value="{{forgotSent}}" hint-placeholder-val="{{false}}"><button onClick="{{go.login}}" class="lk">Back to log in</button></sc-if>
</div>
</div>
</sc-if>

</div>
</template>
<script src="morphdom.min.js"></script>
<script src="runtime.js"></script>
<script src="app.js"></script>
</body>
</html>
